name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: camery_test
          POSTGRES_USER: camery_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camery_test -d camery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate the repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check typed lint, workspace task graph, coverage and golden evaluation gates
        run: pnpm check
      - name: Verify PostgreSQL durable execution and process recovery
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/durable test:integration --coverage
      - name: Verify transactional version adoption and rollback
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/versioning test:integration --coverage
      - name: Validate private infrastructure configuration
        env:
          CAMERY_POSTGRES_PASSWORD: ci-config-check-only
        run: docker compose -f deploy/compose.private.yml config --quiet
      - name: Verify document batches, reading checkpoints and restart recovery
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/ingest test:integration --coverage
      - name: Verify agent dispatch, gates and durable replay
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/agents test:integration --coverage
      - name: Verify pinned Bible sources, restricted role and durable chunk recovery
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/bible test:integration --coverage
      - name: Verify staged original development, reviews and budgeted process recovery
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: pnpm --filter @camery/script test:integration --coverage
      - name: Verify authentication, restricted database role and HTTP isolation
        env:
          CAMERY_TEST_DATABASE_URL: postgresql://camery_test:ci-test-only@127.0.0.1:5432/camery_test
        run: |
          pnpm --filter @camery/access test:integration --coverage
          pnpm --filter @camery/server test:integration --coverage
      - name: Build browser source workbench
        run: pnpm --filter @camery/web build
      - name: Build private API and worker runtime image
        run: docker build -f deploy/Dockerfile.api -t camery-api:phase0 .
      - name: Start isolated private API database fixture
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          writeFileSync('deploy/.env.phase0', [
            'CAMERY_POSTGRES_DB=camery_api_ci',
            'CAMERY_POSTGRES_USER=camery_api_ci_admin',
            'CAMERY_POSTGRES_PASSWORD=ci-test-only',
            'CAMERY_POSTGRES_BIND_ADDRESS=127.0.0.1',
            'CAMERY_POSTGRES_PORT=0',
          ].join('\n') + '\n', { flag: 'wx', mode: 0o600 });
          writeFileSync(join(process.env.RUNNER_TEMP, 'camery-api-ci-owned'), 'owned\n', { flag: 'wx' });
          NODE
          docker compose --project-name camery-phase0 --env-file deploy/.env.phase0 -f deploy/compose.private.yml up -d --wait postgres
      - name: Verify built API, low privilege login, restart and revocation
        run: pnpm test:private-api:local
      - name: Verify scoped worker, budget, persistent human gate and crash recovery
        run: pnpm test:private-worker:local
      - name: Verify built original development API and worker with isolated HTTP protocol fixtures
        run: pnpm test:private-development:local
      - name: Verify built outline recovery, formal adoption and immutable history
        run: pnpm test:private-outline:local
      - name: Remove this job's private API database fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/camery-api-ci-owned" ]; then
            docker compose --project-name camery-phase0 --env-file deploy/.env.phase0 -f deploy/compose.private.yml down --volumes
          fi
