{
  "id": "chapter-segmentation",
  "version": "1.0.0",
  "stage": "input",
  "inputKinds": [
    "novel",
    "script"
  ],
  "languages": [
    "zh"
  ],
  "modelTier": "deterministic",
  "tool": "chapter.segment",
  "outputSchema": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "sourceDigest",
      "offsetUnit",
      "chapters",
      "warnings"
    ],
    "properties": {
      "sourceDigest": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64
      },
      "offsetUnit": {
        "type": "string",
        "enum": [
          "utf16"
        ]
      },
      "warnings": {
        "type": "array",
        "items": {
          "type": "string",
          "enum": [
            "NO_EXPLICIT_HEADINGS"
          ]
        }
      },
      "chapters": {
        "type": "array",
        "minItems": 1,
        "maxItems": 10000,
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "ordinal",
            "kind",
            "title",
            "start",
            "end"
          ],
          "properties": {
            "ordinal": {
              "type": "integer",
              "minimum": 0
            },
            "kind": {
              "type": "string",
              "enum": [
                "frontmatter",
                "chapter"
              ]
            },
            "title": {
              "type": "string"
            },
            "start": {
              "type": "integer",
              "minimum": 0
            },
            "end": {
              "type": "integer",
              "minimum": 1
            }
          }
        }
      }
    }
  },
  "provenance": {
    "kind": "derived",
    "sources": [
      {
        "url": "https://zh.wikisource.org/w/index.php?title=%E8%80%81%E6%AE%98%E9%81%8A%E8%A8%98%2F%E7%AC%AC01%E5%9B%9E&oldid=2367222",
