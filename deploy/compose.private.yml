name: camery-private

# Phase 0 infrastructure only. App/media services are added when implemented.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CAMERY_POSTGRES_DB:-camery}
      POSTGRES_USER: ${CAMERY_POSTGRES_USER:-camery_admin}
      POSTGRES_PASSWORD: ${CAMERY_POSTGRES_PASSWORD:?Set CAMERY_POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "${CAMERY_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${CAMERY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
